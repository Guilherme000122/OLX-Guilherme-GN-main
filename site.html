<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Compraê - Produtos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="logo">Compraê</div>

<nav>
<a href="site.html">Início</a>
<a href="#produtos">Produtos</a>
<a href="#publicar">Publicar</a>
<button type="button" id="botaoSair" class="botao-sair">Sair</button>
</nav>
</header>

<main class="site-main">

<section class="boas-vindas">
<h1>Olá, <span id="nomeUsuario"></span>!</h1>
<p>Encontre produtos ou publique algo para vender.</p>
</section>

<section id="publicar" class="formulario">

<h2>Publicar produto</h2>

<form id="formProduto">

<input type="text" id="nomeProduto" placeholder="Nome do produto" required>

<input type="number" id="precoProduto" placeholder="Preço" min="0" step="0.01" required>

<select id="tipoProduto" required>
<option value="">Categoria</option>
<option value="Roupas">Roupas</option>
<option value="Calçados">Calçados</option>
<option value="Acessórios">Acessórios</option>
<option value="Outros">Outros</option>
</select>

<input type="file" id="imagemProduto" accept="image/*" required>

<button type="submit" class="botao">Publicar produto</button>

<p id="mensagemProduto"></p>

</form>

</section>

<section id="produtos" class="produtos">

<h2>Produtos anunciados</h2>

<input type="search" id="buscaProdutos" placeholder="Pesquisar produto ou categoria...">

<div id="listaProdutos" class="lista-produtos"></div>

</section>

</main>

<footer>
<p id="dataAtual"></p>
<p>Todos os direitos reservados.</p>
<p>Desenvolvido por Guilherme S., GN.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
