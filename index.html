<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compraê</title>

    <link rel="stylesheet" href="style.css">
</head>
<script src="script.js"></script>
<body>

    <header>
        <h1>Compraê</h1>

        <button id="botaoLogin">
            Entrar / Cadastrar
        </button>
    </header>


    <main>
        <h2>Bem-vindo ao Compraê!</h2>

        <p>
            Compre, venda e encontre produtos de forma fácil.
        </p>
    </main>


    <!-- JANELA DE LOGIN -->
    <div id="modalLogin" class="modal">

        <div class="caixa">

            <button id="fechar" class="fechar">×</button>


            <!-- LOGIN -->

            <div id="areaLogin">

                <h2>Entrar</h2>

                <input
                    type="email"
                    id="emailLogin"
                    placeholder="E-mail"
                >

                <input
                    type="password"
                    id="senhaLogin"
                    placeholder="Senha"
                >

                <button id="entrar">
                    Entrar
                </button>

                <p id="mensagemLogin"></p>

                <p>
                    Não possui uma conta?
                    <a href="#" id="irCadastro">
                        Cadastre-se
                    </a>
                </p>

            </div>


            <!-- CADASTRO -->

            <div id="areaCadastro" style="display: none;">

                <h2>Criar conta</h2>

                <input
                    type="text"
                    id="nomeCadastro"
                    placeholder="Nome"
                >

                <input
                    type="email"
                    id="emailCadastro"
                    placeholder="E-mail"
                >

                <input
                    type="password"
                    id="senhaCadastro"
                    placeholder="Senha"
                >

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirmar senha"
                >

                <button id="cadastrar">
                    Criar conta
                </button>

                <p id="mensagemCadastro"></p>

                <p>
                    Já possui uma conta?
                    <a href="#" id="irLogin">
                        Entrar
                    </a>
                </p>

            </div>

        </div>

    </div>


    <!-- IMPORTANTE: deixar o script no final -->
    <script src="script.js"></script>

</body>

</html>
